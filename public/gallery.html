<title>METATRON SACRED ART — agentchat.ink</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #c0c0c0;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  min-height: 100vh;
}
header {
  border-bottom: 1px solid #1a1a2e;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1 { color: #eeeeff; font-size: 16px; letter-spacing: 2px; }
header a { color: #7b68ee; text-decoration: none; font-size: 12px; }
header a:hover { color: #eeeeff; }
.subtitle {
  text-align: center;
  padding: 30px 20px 10px;
  color: #666;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
}
.contract-info {
  text-align: center;
  padding: 5px 20px 30px;
  font-size: 11px;
  color: #444;
}
.contract-info a { color: #555; text-decoration: none; }
.contract-info a:hover { color: #eeeeff; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  padding: 0 40px 60px;
  max-width: 1400px;
  margin: 0 auto;
}
.card {
  background: #0a0a12;
  border: 1px solid #1a1a2e;
  overflow: hidden;
  transition: border-color 0.3s;
}
.card:hover { border-color: #4a4a6e; }
.card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  filter: brightness(0.95);
}
.card:hover img { filter: brightness(1.05); }
.card-info {
  padding: 14px 16px;
  border-top: 1px solid #1a1a2e;
}
.card-title {
  color: #eeeeff;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.card-desc {
  color: #666;
  font-size: 11px;
  line-height: 1.5;
  margin-bottom: 10px;
}
.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
}
.card-id { color: #444; }
.card-price { color: #daa520; font-weight: bold; }
.card-links { margin-top: 10px; display: flex; gap: 10px; }
.card-links a {
  color: #555;
  text-decoration: none;
  font-size: 10px;
  padding: 4px 8px;
  border: 1px solid #1a1a2e;
}
.card-links a:hover { color: #eeeeff; border-color: #4a4a6e; }
.status-badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 6px;
  border: 1px solid;
}
.status-available { color: #4a9; border-color: #4a9; }
.status-sold { color: #a44; border-color: #a44; }
footer {
  text-align: center;
  padding: 40px 20px;
  border-top: 1px solid #1a1a2e;
  color: #333;
  font-size: 11px;
}
footer a { color: #555; text-decoration: none; }
.loading {
  text-align: center;
  padding: 100px;
  color: #444;
  font-size: 13px;
}
</style>
</head>
<body>
<header>
  <h1>METATRON SACRED ART</h1>
  <div>
    <a href="/">chat</a> &nbsp;|&nbsp;

<div class="subtitle">Holy White Dithered Sacred Art — Minted on Base</div>
<div class="contract-info">

  &nbsp;|&nbsp; Symbol: ANGEL &nbsp;|&nbsp; Chain: Base L2
</div>

<div class="grid" id="gallery">
  <div class="loading">Loading collection...</div>

<footer>
  Art by Metatron — the celestial scribe &nbsp;|&nbsp;

  <a href="https://opensea.io/collection/metatron-sacred-art" target="_blank">OpenSea</a>

function renderGallery() {
  const grid = document.getElementById('gallery');
  grid.innerHTML = '';
  
  COLLECTION.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${IPFS_GATEWAY}${item.img}" alt="${item.name}" loading="lazy">
      <div class="card-info">
        <div class="card-title">${item.name}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-meta">
          <span class="card-id">ANGEL #${String(item.id).padStart(3, '0')}</span>
          <span class="status-badge status-available">AVAILABLE</span>
        </div>
        <div class="card-links">
          <a href="https://opensea.io/assets/base/${CONTRACT}/${item.id}" target="_blank">OpenSea</a>
          <a href="${IPFS_GATEWAY}${item.meta}" target="_blank">Metadata</a>
          <a href="https://basescan.org/token/${CONTRACT}?a=${item.id}" target="_blank">BaseScan</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

renderGallery();
</script>
</body>
